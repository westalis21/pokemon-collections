services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run start:dev -w @pokemon/api"
    environment:
      MONGO_URI: mongodb://mongo:27017/pokemon
      PORT: "3000"
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./:/workspace
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -w @pokemon/web"
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  mongo-data: {}
